<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; max-width: 500px; margin: 60px auto; padding: 0 16px; }
    h1 { margin-bottom: 24px; font-size: 1.8rem; }
    .add-form { display: flex; gap: 8px; margin-bottom: 24px; }
    .add-form input { flex: 1; padding: 8px 12px; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; }
    .add-form button { padding: 8px 16px; font-size: 1rem; background: #4f46e5; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    .add-form button:hover { background: #4338ca; }
    ul { list-style: none; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 4px; margin-bottom: 8px; }
    li button { background: none; border: none; color: #ef4444; font-size: 1.1rem; cursor: pointer; }
    li button:hover { color: #b91c1c; }
    .empty { color: #9ca3af; text-align: center; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>Todos</h1>
  <div class="add-form">
    <input id="todoInput" type="text" placeholder="What needs to be done?" />
    <button onclick="addTodo()">Add - Submit</button>
  </div>
  <ul id="todoList"></ul>
  <p id="emptyMsg" class="empty" style="display:none">No todos yet. Add one above. This is test</p>

  <script src="app.js"></script>
</body>
</html>
